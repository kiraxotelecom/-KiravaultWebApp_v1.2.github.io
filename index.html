function showT(msg,undo){const t=$('#toast');t.innerHTML='';const s=document.createElement('span');s.textContent=msg;const b=document.createElement('button');b.textContent='Undo';b.className='p s';b.onclick=()=>{hideT();undo()};t.append(s,b);t.hidden=false;tmr=setTimeout(hideT,8000)}

/* ---------- Backup reminder + persistent storage ---------- */
let pst=null;
const bkAge=()=>S.bk?-dd(S.bk):null,
 bkTxt=()=>{const a=bkAge();return a===null?'never':a<=0?'today':a==1?'yesterday':a+' days ago'},
 hasData=()=>S.tx.length||S.cm.length||S.pr.length||S.gl.length;
async function persist(ask){try{if(navigator.storage&&navigator.storage.persisted){pst=await navigator.storage.persisted();if(!pst&&ask&&navigator.storage.persist)pst=await navigator.storage.persist()}}catch(e){}if(tab=='more')render()}
function bkBanner(){const a=bkAge();
 if(hasData()&&(a===null||a>=7))return C('amber','ab',H('Back up your data','amber')+`<b style="display:block;font-size:16px;margin:4px 0">${a===null?'You have never backed up':'Last backup '+a+' days ago, back up now'}</b><small>Everything lives in this browser. Clearing site data or losing this phone erases it.</small><div class=row style="justify-content:flex-start"><button class=p onclick=bak()>Back up now</button></div>`);
 return C('green','gb',H('Backup','green')+`<b style="display:block;font-size:16px;margin-top:4px">Last backup ${bkTxt()}</b>`)}
async function bak(force){const name=`kiravault-${td()}.json`,text=JSON.stringify({...S,bk:td()}),f=new File([text],name,{type:'application/json'});
 try{if(!force&&navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'KiraVault backup'});else dl(name,text,'application/json')}
 catch(e){if(e&&e.name=='AbortError')return;dl(name,text,'application/json')}
 S.bk=td();save()}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
const pstTxt=()=>pst===true?'<small class=g><b>✓ Protected.</b> This browser has marked KiraVault data as persistent, so it will not be cleared automatically when the phone runs low on space.</small>':pst===false?'<small class=a><b>Not protected yet.</b> The browser may clear this data when space runs low. Add KiraVault to your home screen, then ask again.</small><div class=row style="justify-content:flex-start"><button class=s onclick="persist(1)">Ask browser to protect my data</button></div>':'<small>This browser cannot mark storage as persistent. Keep regular backups.</small>';

/* ---------- Edit / delete transactions ---------- */
function txMenu(i){const t=S.tx.find(x=>x.id==i);if(!t)return;const d=$('#dlg');
 d.innerHTML=`<h3>${E(t.desc||t.cat||t.type)}</h3><small>${t.date} · ${E(t.acc)}${t.type=='transfer'?' → '+E(t.to):''} · UGX ${F(t.amt)}</small><div class=row style="justify-content:flex-start;flex-wrap:wrap"><button class=p onclick="dlg.close();editTx(${i})">Edit</button><button onclick="dlg.close();UD('Transaction deleted',()=>{const x=S.tx.find(x=>x.id==${i});if(x)delTx(x)})">Delete</button><button onclick=dlg.close()>Cancel</button></div>`;d.showModal()}
function editTx(i){const t=S.tx.find(x=>x.id==i);if(!t)return;
 const tr=t.type=='transfer',lk=!!(t.cid||t.gid||t.pid),free=!tr&&!lk&&(t.type=='expense'||t.type=='income'),co=[...CATS,'Salary','Freelance','Business','Gift','Other'];
 if(t.cat&&!co.includes(t.cat))co.unshift(t.cat);
 ask('Edit transaction',[...(free?[{k:'type',l:'Type',o:['expense','income'],v:t.type}]:[]),{k:'amt',l:'Amount (25k, 1.5m, 150,000)',v:t.amt,m:1},...(tr?[]:[{k:'acc',l:'Account',o:AN(),v:t.acc}]),...(tr||t.type=='saving'?[]:[{k:'cat',l:'Category (expense) / source (income)',o:co,v:t.cat}]),{k:'desc',l:'Note',v:t.desc},{k:'date',l:'Date',t:'date',v:t.date}],f=>{
  const a=pa(f.amt);if(!a)return'Enter a valid amount';
  const nt=free?f.type:t.type,na=tr?t.acc:f.acc,ef=(y,m)=>y=='income'?m:-m,B={};
  S.acc.forEach(x=>B[x.id]=x.b);B[t.acc]-=ef(t.type,t.amt);if(tr)B[t.to]-=t.amt;
  const av=B[na];B[na]+=ef(nt,a);if(tr)B[t.to]+=a;
  if(nt!='income'&&B[na]<0&&B[na]<acc(na).b)return`${na} only has UGX ${F(Math.max(av,0))}`;
  if(t.cid){const c=S.cm.find(x=>x.id==t.cid);if(c&&c.paid-t.amt+a>c.amt+.5)return`This bill is only UGX ${F(c.amt-c.paid+t.amt)}`}
  S.acc.forEach(x=>x.b=B[x.id]);const df=a-t.amt;
  if(t.cid){const c=S.cm.find(x=>x.id==t.cid);if(c){c.paid=Math.max(c.paid+df,0);c.st=c.paid>=c.amt-.5?'paid':'pending'}}
  if(t.gid){const g=g_(t.gid);if(g)g.saved=Math.max(g.saved+df,0)}
  if(t.pid){const p=p_(t.pid),y=p&&p.pay.find(x=>x.id==t.pp);if(y)y.amt=a}
  Object.assign(t,{type:nt,amt:a,acc:na,desc:f.desc,date:f.date||t.date});
  if(!tr&&t.type!='saving'&&f.cat)t.cat=f.cat;
  learn(f.desc,t.cat,t.type);save()})}

/* ---------- Smarter quick add: remember corrections ---------- */
const norm=s=>(String(s||'').toLowerCase().match(/[a-z']+/g)||[]).filter(w=>!STOPRE.test(w));
function gs(D,inc){const ok=c=>c&&(inc?INCS.includes(c):CATS.includes(c)),ph=D.join(' ');let c=S.cr[ph];if(ok(c))return c;c=D.map(w=>S.cr[w]).find(ok);if(c)return c;
 return inc?(D.map(w=>SRC[w]).find(Boolean)||'Other'):(D.map(w=>Object.keys(CW).find(k=>CW[k].split(' ').includes(w))).find(Boolean)||'Others')}
function learn(desc,cat,type){if(type!='expense'&&type!='income')return;const D=norm(desc);if(!D.length||!cat)return;
 const keys=[D.join(' ')];if(D.length<=2)keys.push(...D.filter(w=>w.length>2));
 keys.forEach(k=>{if(cat=='Others'||cat=='Other')delete S.cr[k];else S.cr[k]=cat});
 const ks=Object.keys(S.cr);if(ks.length>300)ks.slice(0,ks.length-300).forEach(k=>delete S.cr[k])}
function forgetR(k){UD('Forgot "'+k+'"',()=>{delete S.cr[k]})}
function memCard(){const e=Object.entries(S.cr);return`<h3>Quick add memory</h3><div class=card><small>${e.length?'KiraVault remembers the category you pick, so the same words land there next time.':'When you pick a category after a quick add, KiraVault remembers it (for example rolex → Food).'}</small>${e.slice(mqAll?-300:-3).reverse().map(([k,v])=>`<div class=top style="margin-top:6px"><small>${E(k)} → <b>${E(v)}</b></small><button class=s data-k="${E(k)}" onclick="forgetR(this.dataset.k)">✕</button></div>`).join('')}${e.length?`<div class=row style="justify-content:flex-start"><button class=s onclick="UD('Quick add memory cleared',()=>{S.cr={}})">Forget all (${e.length})</button>${e.length>3?`<button class=s onclick="mqAll=!mqAll;render()">${mqAll?'Show less':'See all ('+e.length+')'}</button>`:''}</div>`:''}</div>`}

/* ---------- Plan Month ---------- */
let pmo=0;
function cmMonth(ym,cur){const[Y,M]=ym.split('-').map(Number),f=ym+'-01',l=ym+'-'+String(dim(Y,M-1)).padStart(2,'0'),o=[];
 S.cm.forEach(c=>{if(!c.due)return;
  if(c.st=='paid'){if(c.due>=f&&c.due<=l)o.push({c,due:c.due,amt:c.amt,left:0,paid:1});return}
  if(c.due>=f&&c.due<=l)o.push({c,due:c.due,amt:c.amt,left:rem(c)});
  else if(cur&&c.due<f)o.push({c,due:c.due,amt:c.amt,left:rem(c),late:1});
  if(c.rec=='Monthly'&&c.due<=l){let k=1,d=addM(c.due,k);while(d<f&&k<240)d=addM(c.due,++k);if(d>=f&&d<=l&&d!=c.due)o.push({c,due:d,amt:c.amt,left:c.amt,proj:1})}
  if(c.rec=='Weekly'){let d=addD(c.due,7);while(d<f)d=addD(d,7);for(;d<=l;d=addD(d,7))o.push({c,due:d,amt:c.amt,left:c.amt,proj:1})}});
 return o.sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0)}

 const ym=ym0(pmo),[Y,M]=ym.split('-').map(Number),n=dim(Y,M-1),f=ym+'-01',l=ym+'-'+String(n).padStart(2,'0'),cur=pmo==0,

  br=x=>row(x.c.title,`${x.c.kind} · ${x.late?'overdue since ':'due '}${fm(x.due)}${x.proj?' · repeats':''}${x.paid?' · paid ✓':''}`,F(x.amt),x.paid?'g':x.late?'r':''),

 return`<div class=top><button class=s onclick="pmo--;render()">‹</button><h1 style="margin:0">Plan · ${lab}</h1><button class=s onclick="pmo=Math.min(pmo+1,12);render()">›</button></div><div style="height:10px"></div>`
