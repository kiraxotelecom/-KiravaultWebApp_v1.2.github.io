function editTx(i){const t=S.tx.find(x=>x.id==i);if(!t)return;
 const tr=t.type=='transfer',lk=!!(t.cid||t.gid||t.pid),free=!tr&&!lk&&(t.type=='expense'||t.type=='income'),co=[...CATS,'Salary','Freelance','Business','Gift','Other'];
 if(t.cat&&!co.includes(t.cat))co.unshift(t.cat);
 ask('Edit transaction',[...(free?[{k:'type',l:'Type',o:['expense','income'],v:t.type}]:[]),{k:'amt',l:'Amount (25k, 1.5m, 150,000)',v:t.amt,m:1},...(tr?[]:[{k:'acc',l:'Account',o:AN(),v:t.acc}]),...(tr||t.type=='saving'?[]:[{k:'cat',l:'Category (expense) / source (income)',o:co,v:t.cat}]),{k:'desc',l:'Note',v:t.desc},{k:'date',l:'Date',t:'date',v:t.date},...(t.type=='expense'||free?[{k:'oo',l:'One-off? (kept out of averages)',o:['No','Yes'],v:t.oo?'Yes':'No'}]:[])],f=>{

 const keys=[D.join(' ')];if(D.length<=2)keys.push(...D.filter(w=>w.length>2));
